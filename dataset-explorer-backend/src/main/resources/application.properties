spring.application.name=interactive-dataset-explorer

# Server Configuration
server.port=8080

# File Upload Settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- KEY SETTINGS START ---
# Local path for file storage
storage.location=uploads

# DuckDB JDBC Path (The placeholder that was missing)
duckdb.path=jdbc:duckdb:./dataset_explorer.db

# Standard Spring Datasource (Helpful for JdbcTemplate auto-detection)
spring.datasource.url=jdbc:duckdb:./dataset_explorer.db
spring.datasource.driver-class-name=org.duckdb.DuckDBDriver
# --- KEY SETTINGS END ---

# Java 21 Performance
spring.threads.virtual.enabled=true

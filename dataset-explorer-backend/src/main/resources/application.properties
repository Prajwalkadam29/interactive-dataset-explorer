spring.application.name=interactive-dataset-explorer

# Server Configuration
server.port=8080

# File Upload Settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- KEY SETTINGS START ---
# Local path for file storage
storage.location=uploads

# DuckDB JDBC Path (The placeholder that was missing)
duckdb.path=jdbc:duckdb:./dataset_explorer.db

# Standard Spring Datasource (Helpful for JdbcTemplate auto-detection)
spring.datasource.url=jdbc:duckdb:./dataset_explorer.db
spring.datasource.driver-class-name=org.duckdb.DuckDBDriver
# --- KEY SETTINGS END ---

# Java 21 Performance
spring.threads.virtual.enabled=true

# --- GROQ AI CONFIGURATION ---
# Get your key from https://console.groq.com/
langchain4j.open-ai.chat-model.api-key=${GROQ_API_KEY}
langchain4j.open-ai.chat-model.base-url=https://api.groq.com/openai/v1
langchain4j.open-ai.chat-model.model-name=llama-3.3-70b-versatile
# Note: Set temperature=0.0 for data analysis. We want the AI to be precise with SQL, not "creative."
langchain4j.open-ai.chat-model.temperature=0.0
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true
